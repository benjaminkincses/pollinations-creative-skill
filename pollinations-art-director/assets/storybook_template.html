<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: Georgia, "Times New Roman", serif; margin: 0; padding: 2rem 1rem 4rem;
         background: #faf6ef; color: #222; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { text-align: center; font-size: 2rem; line-height: 1.25; margin: 0.5rem 0 1rem; }
  .player { text-align: center; margin: 1rem 0 2rem; }
  .page { margin: 0 0 2.5rem; }
  .page img { width: 100%; height: auto; display: block; border-radius: 10px;
              box-shadow: 0 4px 24px rgba(0,0,0,0.18); }
  .page p { font-size: 1.2rem; line-height: 1.6; text-align: center; padding: 0 1rem; }
  footer { text-align: center; font-size: 0.85rem; opacity: 0.65; margin-top: 3rem; }
  @media (prefers-color-scheme: dark) { body { background: #17150f; color: #eee7d8; } }
  @media print { .player { display: none; } .page { break-inside: avoid; } }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  {{AUDIO}}
  {{PAGES}}
  <footer>Made with Pollinations models: story, illustrations and narration generated from one topic.</footer>
</main>
</body>
</html>
